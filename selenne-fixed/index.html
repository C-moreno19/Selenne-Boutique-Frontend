      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <!-- Carga no bloqueante: el navegador la descarga con baja prioridad
           (media="print" no bloquea el render) y la activa con onload.
           Evita ~1s de render-blocking por la ida y vuelta a fonts.googleapis.com. -->
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
        media="print"
        onload="this.media='all'"
      />
      <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
      </noscript>
